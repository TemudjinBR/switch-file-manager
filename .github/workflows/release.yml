name: Promover versão homologada

on:
  workflow_call:
    inputs:
      candidate_sha:
        required: true
        type: string
      pr_number:
        required: true
        type: string
      approval_comment:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Commit completo homologado; deve ser o head exato do PR
        required: true
        type: string
      pr_number:
        description: PR revisado, aberto e com base main
        required: true
        default: '1'
        type: string
      approval_comment:
        description: ID do comentário HOMOLOGACAO_SFM_1 do proprietário no PR
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sfm-distribuicao
  cancel-in-progress: false

jobs:
  criteria:
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: read
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verificar commit, CI, proteção, revisão e homologação física
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          APPROVAL_COMMENT: ${{ inputs.approval_comment }}
        run: python3 scripts/github_distribution.py criteria --sha "$CANDIDATE_SHA" --pr "$PR_NUMBER" --approval-comment "$APPROVAL_COMMENT"
  validated:
    needs: criteria
    uses: ./.github/workflows/validate.yml
    with:
      ref: ${{ inputs.candidate_sha }}
      channel: stable
  publish:
    needs: [criteria, validated]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: SwitchFileManager-validado
          path: dist
      - name: Revalidar gates, efetuar merge controlado e publicar
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          APPROVAL_COMMENT: ${{ inputs.approval_comment }}
        run: python3 scripts/github_distribution.py publish --channel stable --sha "$CANDIDATE_SHA" --pr "$PR_NUMBER" --approval-comment "$APPROVAL_COMMENT"
