name: Compilar e publicar Switch File Manager

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar NRO
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITA64=/opt/devkitpro/devkitA64
          export PATH="$PATH:$DEVKITA64/bin:$DEVKITPRO/tools/bin"
          make -j2
          test -s SwitchFileManager.nro

      - name: Disponibilizar NRO de teste
        uses: actions/upload-artifact@v4
        with:
          name: SwitchFileManager-nro-teste
          path: SwitchFileManager.nro
          if-no-files-found: error

      - name: Preparar versao e checksum
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^[[:space:]]*APP_VERSION[[:space:]]*:=[[:space:]]*([^[:space:]#]+).*/\1/p' Makefile | head -n1)"
          test -n "$version"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          sha256sum SwitchFileManager.nro > SwitchFileManager.nro.sha256

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Switch File Manager ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            SwitchFileManager.nro
            SwitchFileManager.nro.sha256
          fail_on_unmatched_files: true
          overwrite_files: false
          generate_release_notes: true
          
