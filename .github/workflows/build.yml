name: Compilar e testar Switch File Manager

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Referência imutável para validação de uma tag
        type: string
        default: ''
      channel:
        description: Canal do pacote; stable somente no controlador de promoção
        type: string
        default: experimental

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Testes automatizados no host
        run: python3 tests/run.py

  build:
    needs: tests
    runs-on: ubuntu-latest
    container: devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validar contexto Git do contêiner
        shell: bash
        run: |
          set -euo pipefail
          # checkout usa HOME temporário: a confiança deve existir também neste shell.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" rev-parse --show-toplevel
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD
      - name: Compilar, validar e empacotar
        env:
          SFM_CHANNEL: ${{ inputs.channel || 'experimental' }}
        shell: bash
        run: |
          set -euo pipefail
          export DEVKITPRO=/opt/devkitpro DEVKITA64=/opt/devkitpro/devkitA64
          export PATH="$PATH:$DEVKITA64/bin:$DEVKITPRO/tools/bin"
          make clean
          make -j2
          python3 scripts/validate_nro.py SwitchFileManager.nro
          python3 scripts/validate_nro.py SfmUpdateHelper.nro --title "Atualizador do Switch File Manager"
          python3 tests/run.py --nro SwitchFileManager.nro
          SFM_SOURCE_COMMIT="$(git rev-parse HEAD)" python3 scripts/package.py --channel "$SFM_CHANNEL"
          git diff --exit-code
      - name: Disponibilizar distribuição de teste
        uses: actions/upload-artifact@v4
        with:
          name: SwitchFileManager-validado
          path: dist/*
          if-no-files-found: error
