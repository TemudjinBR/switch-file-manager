name: Compilar e testar Switch File Manager

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: SHA completo; vazio usa o commit da branch selecionada
        required: false
        type: string
      publish_experimental:
        description: Publicar pré-Release após os testes, sem merge
        type: boolean
        default: false
      promote_stable:
        description: Encaminhar à promoção com gates físicos (tem prioridade)
        type: boolean
        default: false
      pr_number:
        description: PR revisado para promoção estável
        type: string
        default: '1'
      approval_comment:
        description: ID da homologação do proprietário, obrigatório para promover
        type: string
        required: false
  workflow_call:
    inputs:
      ref:
        description: Referência imutável para validação de uma tag
        type: string
        default: ''
      channel:
        description: Canal do pacote; stable somente no controlador de promoção
        type: string
        default: experimental

permissions:
  contents: read

jobs:
  tests:
    if: ${{ !inputs.promote_stable }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Testes automatizados no host
        run: python3 tests/run.py

  build:
    needs: tests
    runs-on: ubuntu-latest
    container: devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validar contexto Git do contêiner
        shell: bash
        run: |
          set -euo pipefail
          # checkout usa HOME temporário: a confiança deve existir também neste shell.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" rev-parse --show-toplevel
          git -C "$GITHUB_WORKSPACE" rev-parse HEAD
      - name: Instalar fonte apenas para testes de renderização no host
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends fonts-dejavu-core
      - name: Compilar, validar e empacotar
        env:
          SFM_CHANNEL: ${{ inputs.channel || 'experimental' }}
        shell: bash
        run: bash scripts/ci_build.sh
      - name: Disponibilizar distribuição de teste
        uses: actions/upload-artifact@v4
        with:
          name: SwitchFileManager-validado
          path: dist/*
          if-no-files-found: error

  publish-experimental:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish_experimental && !inputs.promote_stable && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: sfm-distribuicao
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: SwitchFileManager-validado
          path: dist
      - name: Publicar somente no canal experimental
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}
        run: python3 scripts/github_distribution.py publish --channel experimental --sha "$CANDIDATE_SHA"

  promote-stable:
    if: github.event_name == 'workflow_dispatch' && inputs.promote_stable && github.actor == github.repository_owner
    permissions:
      contents: write
      pull-requests: write
      actions: read
      issues: read
    uses: ./.github/workflows/release.yml
    with:
      candidate_sha: ${{ inputs.candidate_sha || github.sha }}
      pr_number: ${{ inputs.pr_number || '1' }}
      approval_comment: ${{ inputs.approval_comment }}
