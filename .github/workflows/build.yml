name: Compilar e publicar Switch File Manager

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar NRO
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITA64=/opt/devkitpro/devkitA64
          export PATH="$PATH:$DEVKITA64/bin:$DEVKITPRO/tools/bin"
          make -j2
          test -s SwitchFileManager.nro

      - name: Disponibilizar NRO de teste
        uses: actions/upload-artifact@v4
        with:
          name: SwitchFileManager-nro-teste
          path: SwitchFileManager.nro
          if-no-files-found: error

      - name: Preparar publicacao
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^[[:space:]]*APP_VERSION[[:space:]]*:=[[:space:]]*([^[:space:]#]+).*/\1/p' Makefile | head -n1)"
          test -n "$version"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          sha256sum SwitchFileManager.nro > SwitchFileManager.nro.sha256

      - name: Publicar Release se a versao ainda nao existir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG ja existe; nao substituir artefato publicado."
            exit 0
          fi
          gh release create "$RELEASE_TAG"             SwitchFileManager.nro             SwitchFileManager.nro.sha256             --title "Switch File Manager $RELEASE_TAG"             --notes "Build automatizado a partir do commit $GITHUB_SHA. Versao experimental: valide no console antes de usar com arquivos importantes."             --target "$GITHUB_SHA"
          
